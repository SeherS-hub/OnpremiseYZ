<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönetici Asistanı</title>
<style>
:root{
  --paper:#F4F7F8; --surface:#FFFFFF; --surface-2:#EAF0F2;
  --ink:#101820; --ink-2:#465862; --ink-3:#7D919B;
  --line:#DCE5E9; --line-2:#C2D0D6;
  --accent:#12657F; --accent-ink:#0C4A5E; --accent-soft:#DDEDF3;
  --good:#25664A; --good-soft:#DFEDE5;
  --warn:#9A5312; --warn-soft:#F8EADC;
  --crit:#8C2328; --crit-soft:#F7E3E3;
  --f-ui:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-mono:"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0C1116; --surface:#131C22; --surface-2:#1A252C;
    --ink:#E6EEF2; --ink-2:#A3B6C0; --ink-3:#768B96;
    --line:#25333B; --line-2:#35464F;
    --accent:#5FB4CE; --accent-ink:#93D2E4; --accent-soft:#12303C;
    --good:#68BE94; --good-soft:#15281F;
    --warn:#E09A54; --warn-soft:#2E2118;
    --crit:#E0787C; --crit-soft:#2B1719;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);
     font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.sarmal{max-width:48rem;margin:0 auto;padding:clamp(1.5rem,6vh,4rem) clamp(1rem,5vw,2rem) 3rem}

/* ---------- başlık ---------- */
header{display:flex;align-items:baseline;gap:.7rem;margin-bottom:clamp(1.5rem,5vh,2.75rem)}
h1{font-size:1.35rem;font-weight:600;letter-spacing:-.015em;margin:0}
.durum{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--ink-3)}
.nokta{width:.5rem;height:.5rem;border-radius:50%;background:var(--ink-3)}
.nokta.ok{background:var(--good)}
.nokta.no{background:var(--crit)}

/* ---------- soru ---------- */
.soru-kutu{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
           padding:.5rem .5rem .5rem .95rem;display:flex;gap:.5rem;align-items:center;
           box-shadow:0 1px 2px rgba(16,24,32,.04),0 12px 32px -24px rgba(16,24,32,.25)}
.soru-kutu:focus-within{border-color:var(--accent)}
textarea{flex:1;min-height:2.4rem;max-height:7rem;resize:none;border:0;background:transparent;
         color:var(--ink);font-family:inherit;font-size:1.05rem;line-height:1.5;padding:.5rem 0}
textarea:focus{outline:none}
textarea::placeholder{color:var(--ink-3)}
button{font-family:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line-2);
       background:var(--surface-2);color:var(--ink-2);font-size:.9rem;font-weight:600}
button:hover{border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.yuvarlak{width:2.5rem;height:2.5rem;padding:0;font-size:1.05rem;line-height:1}
.yuvarlak.dinliyor{background:var(--crit);border-color:var(--crit);color:#fff;animation:nabiz 1.2s infinite}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.5}}
.sor-btn{height:2.5rem;padding:0 1.15rem;background:var(--accent);border-color:var(--accent);color:#fff}
.sor-btn:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ornekler{margin-top:.85rem;display:flex;flex-wrap:wrap;gap:.35rem}
.cip{font-size:.82rem;font-weight:400;padding:.34rem .7rem;border-radius:99px;
     border:1px solid var(--line);background:transparent;color:var(--ink-2)}
.cip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- cevap ---------- */
.cevap{margin-top:1.75rem;background:var(--surface);border:1px solid var(--line);
       border-radius:8px;padding:1.15rem 1.25rem;box-shadow:0 1px 2px rgba(16,24,32,.04)}
.cevap.durum-yetkisiz,.cevap.durum-kapsam_disi,.cevap.durum-hata{border-left:3px solid var(--crit)}
.cevap.durum-netlestir{border-left:3px solid var(--warn)}
.cevap.durum-ok{border-left:3px solid var(--accent)}
.deger{font-size:2.35rem;font-weight:700;letter-spacing:-.025em;line-height:1.1;
       font-variant-numeric:tabular-nums;color:var(--ink)}
.etiket{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
        color:var(--ink-3);margin-top:.2rem}
.metin{margin:.75rem 0 0;font-size:1rem;color:var(--ink-2)}
.metin strong{color:var(--ink);font-weight:600}
.kunye{margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--line);
       font-size:.78rem;color:var(--ink-3)}
.kunye .uyari{color:var(--warn)}

.secenekler{display:flex;flex-direction:column;gap:.4rem;margin-top:.9rem}
.secenek{text-align:left;padding:.6rem .75rem;font-weight:500;font-size:.92rem;
         background:var(--surface-2);color:var(--ink)}
.secenek small{display:block;color:var(--ink-3);font-weight:400;font-size:.78rem;margin-top:.1rem}

/* ---------- teknik detay ---------- */
.teknik{margin-top:1.5rem;font-size:.8rem;color:var(--ink-3)}
.teknik summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:.35rem;
                padding:.3rem 0;color:var(--ink-3);font-weight:500}
.teknik summary::-webkit-details-marker{display:none}
.teknik summary::before{content:"›";display:inline-block;transition:transform .15s}
.teknik[open] summary::before{transform:rotate(90deg)}
.teknik-govde{margin-top:.6rem;border:1px solid var(--line);border-radius:6px;
              background:var(--surface);overflow:hidden}
.teknik-bolum{padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.teknik-bolum:last-child{border-bottom:0}
.teknik-bolum h3{margin:0 0 .35rem;font-size:.68rem;font-weight:700;letter-spacing:.09em;
                 text-transform:uppercase;color:var(--ink-3)}
pre{margin:0;font-family:var(--f-mono);font-size:.74rem;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.adimlar{display:flex;flex-wrap:wrap;gap:.25rem;font-family:var(--f-mono);font-size:.7rem}
.adimlar span{padding:.15rem .4rem;background:var(--surface-2);border-radius:3px;color:var(--ink-3)}
.tablo-kap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.78rem}
th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;
   color:var(--ink-3);padding:.35rem .5rem;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:.3rem .5rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.sag{text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- cevap kartı katmanı ---------- */
.katman{position:fixed;inset:0;z-index:50;display:none;background:rgba(4,8,12,.78);
        backdrop-filter:blur(3px);padding:clamp(.6rem,3vw,2rem);overflow-y:auto}
.katman.acik{display:flex;align-items:flex-start;justify-content:center}
.kart{position:relative;width:100%;max-width:54rem;background:#070B10;border:1px solid #1E3346;
      border-radius:8px;box-shadow:0 24px 80px -20px rgba(0,0,0,.9);overflow:hidden;
      animation:kartGir .18s ease-out}
@keyframes kartGir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kart-cubuk{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
            padding:.55rem .7rem;background:#0B1420;border-bottom:1px solid #1E3346}
.kart-cubuk .rozet{font-family:var(--f-mono);font-size:.66rem;font-weight:700;letter-spacing:.1em;
                   text-transform:uppercase;color:#35E0E8}
.kart-cubuk .bosluk{flex:1}
.kbtn{font-size:.78rem;font-weight:600;padding:.36rem .7rem;border-radius:5px;
      border:1px solid #1E3346;background:#0E1520;color:#8FD9DE;text-decoration:none;
      display:inline-block;white-space:nowrap}
.kbtn:hover{border-color:#35E0E8;color:#35E0E8;background:#12202E}
.kbtn.ana{background:#0B8F98;border-color:#0B8F98;color:#04141A}
.kbtn.ana:hover{background:#35E0E8;border-color:#35E0E8;color:#04141A}
.kbtn.kapat{width:1.9rem;padding:.36rem 0;text-align:center;font-size:.95rem}
.kart-govde{min-height:12rem;display:flex;align-items:center;justify-content:center}
.kart-gorsel{display:block;width:100%;height:auto}
.kart-bekle{padding:3rem 1.2rem;font-family:var(--f-mono);font-size:.78rem;color:#4A6B80;text-align:center}
.kart-bekle .nb{animation:nb 1.1s infinite}
@keyframes nb{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="sarmal">

<header>
  <h1>Yönetici Asistanı</h1>
  <span class="durum" id="durum"><span class="nokta"></span><span id="durumMetin">bağlanıyor</span></span>
</header>

<div class="soru-kutu">
  <textarea id="soru" rows="1" placeholder="Satışla ilgili bir soru sorun…" aria-label="Sorunuz"></textarea>
  <button class="yuvarlak" id="mik" title="Sesle sor" aria-label="Sesle sor">🎤</button>
  <button class="yuvarlak" id="ses" title="Cevabı sesli oku" aria-label="Sesli cevap" aria-pressed="true">🔊</button>
  <button class="sor-btn" id="gonder">Sor</button>
</div>

<div class="ornekler" id="ornekler"></div>

<div id="cevapAlani"></div>

<details class="teknik" id="teknik" hidden>
  <summary>Teknik detay</summary>
  <div class="teknik-govde" id="teknikGovde"></div>
</details>

</div>

<!-- ===== cevap kartı ===== -->
<div class="katman" id="katman" role="dialog" aria-modal="true" aria-label="Cevap kartı">
  <div class="kart">
    <div class="kart-cubuk">
      <span class="rozet" id="kartRozet">CEVAP KARTI</span>
      <span class="bosluk"></span>
      <a class="kbtn ana" id="kartDashboard" href="#" target="_blank" rel="noopener">Ana dashboard'a git →</a>
      <a class="kbtn" id="kartPortal" href="#" target="_blank" rel="noopener">PBIRS'te aç</a>
      <button class="kbtn" id="kartYeni">Yeni soru</button>
      <button class="kbtn kapat" id="kartKapat" aria-label="Kapat" title="Kapat (Esc)">×</button>
    </div>
    <div class="kart-govde" id="kartGovde"></div>
  </div>
</div>

<script>
'use strict';
const el = (id) => document.getElementById(id);
const soruAlani = el('soru'), cevapAlani = el('cevapAlani');
let seslendir = true;

function kacir(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function kalinla(s){return kacir(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}

/* ---------------- sağlık ---------------- */
async function saglikYukle(){
  try{
    const s = await (await fetch('/api/saglik')).json();
    /* Tek analitik kaynak SSAS. Burada eskiden s.sql.erisim okunuyordu;
       SQL yedeği kaldırıldığında bu alan da kalktı ve okuma istisna
       atıp catch'e düşüyordu — durum rozeti o günden beri "sunucuya
       ulaşılamıyor" yazıyordu, hem de ajan gayet çalışırken. */
    const ok = !!(s.ssas && s.ssas.erisim);
    el('durum').querySelector('.nokta').className = 'nokta ' + (ok ? 'ok' : 'no');
    el('durumMetin').textContent = ok
      ? s.metrikSayisi + ' onaylı metrik · ' + s.kapsananDonem + ' dönem'
        + (s.calismaZamani ? ' · ' + s.calismaZamani : '')
      : 'semantik modele ulaşılamıyor';
  }catch(e){
    el('durum').querySelector('.nokta').className = 'nokta no';
    el('durumMetin').textContent = 'sunucuya ulaşılamıyor';
  }
}

/* ---------------- örnek sorular ---------------- */
async function orneklerYukle(){
  const liste = await (await fetch('/api/sorular')).json();
  el('ornekler').innerHTML = liste.slice(0,5).map(q =>
    '<button class="cip" data-soru="'+q.soru.replace(/"/g,'&quot;')+'">'+q.soru+'</button>').join('');
  el('ornekler').querySelectorAll('.cip').forEach(b =>
    b.addEventListener('click', () => { soruAlani.value = b.dataset.soru; sor(); }));
}

/* ---------------- soru ---------------- */
async function sor(){
  const soru = soruAlani.value.trim();
  if(!soru) return;
  el('gonder').disabled = true;
  cevapAlani.innerHTML = '<div class="cevap durum-ok"><p class="metin">Yanıt hazırlanıyor…</p></div>';
  el('teknik').hidden = true;
  try{
    const r = await fetch('/api/sor',{method:'POST',headers:{'Content-Type':'application/json'},
                                     body:JSON.stringify({soru})});
    const c = await r.json();
    ciz(c);
    if(seslendir && c.cevap) oku(c.cevap);
    if(c.kayitId && c.durum !== 'netlestir') kartiAc(c);
  }catch(e){
    cevapAlani.innerHTML = '<div class="cevap durum-hata"><p class="metin">İstek başarısız: '+kacir(e.message)+'</p></div>';
  }finally{
    el('gonder').disabled = false;
  }
}

function ciz(c){
  let h = '<div class="cevap durum-'+c.durum+'">';
  if(c.vurgu && c.durum === 'ok'){
    h += '<div class="deger">'+kacir(c.vurgu.deger)+'</div>' +
         '<div class="etiket">'+kacir(c.vurgu.etiket)+'</div>';
  }
  h += '<p class="metin">'+kalinla(c.cevap)+'</p>';
  if(c.alternatif) h += '<p class="metin" style="font-size:.92rem">'+kacir(c.alternatif)+'</p>';

  if(c.secenekler){
    h += '<div class="secenekler">' + c.secenekler.map(s =>
      '<button class="secenek" data-sec="'+kacir(s.ad)+'">'+kacir(s.ad)+
      '<small>'+kacir(s.tanim)+'</small></button>').join('') + '</div>';
  }

  /* tek satır künye — CEO ekranında bu kadarı yeter */
  if(c.durum === 'ok' && c.kunye){
    const k = c.kunye;
    const metrik = Array.isArray(k.metrik) ? k.metrik.join(' · ') : k.metrik;
    let kunye = kacir(metrik) + ' &nbsp;·&nbsp; ' + kacir(k.donem) +
                ' &nbsp;·&nbsp; güven %' + Math.round(k.guven*100);
    const notlar = [].concat(k.belirsizlikler||[], k.aciklamalar||[]);
    if(notlar.length) kunye += '<br><span class="uyari">'+kacir(notlar.join(' · '))+'</span>';
    h += '<div class="kunye">'+kunye+'</div>';
  }
  h += '</div>';
  cevapAlani.innerHTML = h;

  cevapAlani.querySelectorAll('.secenek').forEach(b =>
    b.addEventListener('click', () => { soruAlani.value += ' (' + b.dataset.sec + ')'; sor(); }));

  teknigiDoldur(c);
}

/* Kanıt katmanı: silinmedi, öne çıkmıyor. Demoda "bu sayı nereden geldi"
   sorusu gelince tek tıkla açılıyor. */
function teknigiDoldur(c){
  let t = '';
  if(c.adimlar && c.adimlar.length){
    t += '<div class="teknik-bolum"><h3>İşlem zinciri</h3><div class="adimlar">' +
         c.adimlar.map(a => '<span>'+kacir(a.adim)+' · '+kacir(a.durum)+' · '+a.ms+'ms</span>').join('') +
         '</div></div>';
  }
  if(c.kunye && c.durum === 'ok'){
    const k = c.kunye;
    t += '<div class="teknik-bolum"><h3>Kaynak</h3><pre>' +
         kacir('metrik : ' + (Array.isArray(k.metrik)?k.metrik.join(' · '):k.metrik) + '\n' +
               'tanım  : ' + (k.tanim||'—') + '\n' +
               'kaynak : ' + (k.kaynak||'—') + '\n' +
               'motor  : ' + (k.motor||'—') + '\n' +
               'süre   : ' + k.sureMs + ' ms (sorgu ' + k.sorguSureMs + ' ms)') +
         '</pre></div>';
  }
  if(c.satirlar && c.satirlar.length){
    const kol = Object.keys(c.satirlar[0]);
    t += '<div class="teknik-bolum"><h3>Sonuç kümesi</h3><div class="tablo-kap"><table><thead><tr>' +
         kol.map(k=>'<th>'+kacir(k)+'</th>').join('') + '</tr></thead><tbody>' +
         c.satirlar.map(s => '<tr>' + kol.map(k => {
           const v = s[k], sayi = typeof v === 'number';
           return '<td class="'+(sayi?'sag':'')+'">' +
                  kacir(sayi ? v.toLocaleString('tr-TR',{maximumFractionDigits:2}) : v) + '</td>';
         }).join('') + '</tr>').join('') + '</tbody></table></div></div>';
  }
  if(c.sorgu){
    t += '<div class="teknik-bolum"><h3>Üretilen '+kacir(c.sorgu.dil)+'</h3><pre>'+kacir(c.sorgu.metin)+'</pre></div>';
  }
  if(c.spesifikasyon){
    t += '<div class="teknik-bolum"><h3>Sorgu spesifikasyonu — modelin tek çıktısı</h3><pre>' +
         kacir(JSON.stringify(c.spesifikasyon,null,2)) + '</pre></div>';
  }
  t += '<div class="teknik-bolum"><h3>Ses hakkında</h3><pre>' +
       'Tarayıcının konuşma tanıma özelliği sesi satıcının bulut servisine gönderir.\n' +
       'Kapalı devre kurulumda bu katman şirket içi bir tanıma motoruyla değiştirilmelidir.\n' +
       'Cevabın sesli okunması yereldir, dışarı veri gitmez.' + '</pre></div>';

  el('teknikGovde').innerHTML = t;
  el('teknik').hidden = false;
  el('teknik').open = false;
}

/* ---------------- ses: tanıma ---------------- */
const STT = window.SpeechRecognition || window.webkitSpeechRecognition;
if(STT){
  const tanima = new STT();
  tanima.lang = 'tr-TR'; tanima.interimResults = true; tanima.continuous = false;
  let dinliyor = false;
  el('mik').addEventListener('click', () => {
    if(dinliyor){ tanima.stop(); return; }
    try{ tanima.start(); }catch(e){}
  });
  tanima.onstart = () => { dinliyor = true;  el('mik').classList.add('dinliyor'); };
  tanima.onend   = () => { dinliyor = false; el('mik').classList.remove('dinliyor'); };
  tanima.onerror = (e) => { dinliyor = false; el('mik').classList.remove('dinliyor');
                            console.warn('ses hatasi', e.error); };
  tanima.onresult = (e) => {
    let m = '';
    for(let i=e.resultIndex;i<e.results.length;i++) m += e.results[i][0].transcript;
    soruAlani.value = m;
    if(e.results[e.results.length-1].isFinal) setTimeout(sor, 250);
  };
}else{
  el('mik').disabled = true;
  el('mik').title = 'Bu tarayıcı konuşma tanımayı desteklemiyor (Edge veya Chrome)';
}

/* ---------------- ses: okuma ---------------- */
let sesler = [];
function sesleriYukle(){
  if(!window.speechSynthesis) return;
  sesler = window.speechSynthesis.getVoices() || [];
  const tr = sesler.find(v => (v.lang||'').toLowerCase().startsWith('tr'));
  if(sesler.length) el('ses').title = tr ? ('Cevabı sesli oku — '+tr.name)
                                         : 'Cevabı sesli oku (Türkçe ses yok)';
}
if(window.speechSynthesis){ sesleriYukle(); window.speechSynthesis.onvoiceschanged = sesleriYukle; }
else { el('ses').disabled = true; el('ses').title = 'Bu tarayıcı sesli okumayı desteklemiyor'; }

function oku(metin){
  if(!window.speechSynthesis || !seslendir || !metin) return;
  const duz = String(metin).replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
  if(!duz) return;
  const s = new SpeechSynthesisUtterance(duz);
  const tr = sesler.find(v => (v.lang||'').toLowerCase().startsWith('tr'));
  if(tr) s.voice = tr;
  s.lang = 'tr-TR'; s.rate = 1.05;
  s.onerror = (e) => console.warn('seslendirme hatasi:', e.error);
  try{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(s); }
  catch(e){ console.warn('seslendirilemedi:', e.message); }
}
el('ses').addEventListener('click', () => {
  seslendir = !seslendir;
  el('ses').setAttribute('aria-pressed', String(seslendir));
  el('ses').style.opacity = seslendir ? '1' : '.45';
  if(!seslendir && window.speechSynthesis) window.speechSynthesis.cancel();
});

/* ---------------- cevap kartı ---------------- */
function kartiAc(c){
  const katman = el('katman'), govde = el('kartGovde');
  el('kartRozet').textContent = 'CEVAP KARTI // #' + c.kayitId;
  el('kartDashboard').href = c.dashboardUrl || '#';
  el('kartPortal').href    = c.cevapKartiUrl || '#';
  govde.innerHTML = '<div class="kart-bekle"><span class="nb">cevap kartı üretiliyor…</span></div>';
  katman.classList.add('acik');
  document.body.style.overflow = 'hidden';
  el('kartKapat').focus();

  const img = new Image();
  img.className = 'kart-gorsel';
  img.alt = 'Cevap kartı: ' + (c.cevap||'').replace(/\*\*/g,'');
  img.onload  = () => { govde.innerHTML = ''; govde.appendChild(img); };
  img.onerror = () => { govde.innerHTML =
    '<div class="kart-bekle">Kart üretilemedi — rapor sunucusuna ulaşılamıyor.<br>' +
    'Metin cevabı arkadaki sayfada duruyor.</div>'; };
  img.src = c.cevapKartiGorselUrl;
}
function kartiKapat(){
  el('katman').classList.remove('acik');
  document.body.style.overflow = '';
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}
el('kartKapat').addEventListener('click', kartiKapat);
el('kartYeni').addEventListener('click', () => { kartiKapat(); soruAlani.value=''; soruAlani.focus(); });
el('katman').addEventListener('click', (e) => { if(e.target === el('katman')) kartiKapat(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && el('katman').classList.contains('acik')) kartiKapat();
});

/* ---------------- bağlama ---------------- */
el('gonder').addEventListener('click', sor);
soruAlani.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sor(); }
});
soruAlani.addEventListener('input', () => {
  soruAlani.style.height = 'auto';
  soruAlani.style.height = Math.min(soruAlani.scrollHeight, 112) + 'px';
});

saglikYukle();
orneklerYukle();
soruAlani.focus();

/* PBIRS raporundaki action bu adrese ?soru=... ile gelir.
   Soru kutuya YAZILIR ama kendiliğinden ÇALIŞTIRILMAZ: kullanıcı ne
   soracağını görüp onaylasın. Ayrıca adres temizlenir — yoksa sayfa
   yenilendiğinde aynı soru tekrar tekrar koşuyordu. */
const p = new URLSearchParams(location.search);
if(p.get('soru')){
  soruAlani.value = p.get('soru');
  soruAlani.dispatchEvent(new Event('input'));
  if(p.get('sessiz') === '1') seslendir = false;
  const otomatik = p.get('otomatik') === '1';
  history.replaceState(null, '', location.pathname);
  soruAlani.focus();
  soruAlani.setSelectionRange(soruAlani.value.length, soruAlani.value.length);
  if(otomatik){ setTimeout(sor, 400); }
  else {
    cevapAlani.innerHTML =
      '<div class="cevap durum-netlestir"><p class="metin">' +
      'Rapordan gelen soru kutuya yazıldı. Göndermek için <strong>Sor</strong>\'a basın ' +
      'veya soruyu değiştirin.</p></div>';
  }
}
</script>
